services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/ulric.db
      Storage__Root: /data
      Seed__Enabled: "true"
    volumes:
      - ulric-data:/data
    restart: unless-stopped

volumes:
  ulric-data:
