<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ulric Clip Calendar</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ulric studio clip calendar. Plan short clips by brand, write captions, and review them before they go out." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var stored = localStorage.getItem('ulric-theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var mode = stored === 'light' || stored === 'dark' ? stored : systemDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', mode);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
